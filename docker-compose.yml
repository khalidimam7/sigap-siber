networks:
  sigap-shared:
    external: true

services:
  app:
    build: .
    container_name: sigap-siber
    networks:
      - sigap-shared
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env.production
